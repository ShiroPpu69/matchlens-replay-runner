name: Build replay parser image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "replay-service/**"
      - ".github/workflows/replay-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: replay-parser-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish replay parser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: replay-service/Dockerfile
          push: true
          tags: |
            ghcr.io/shiroppu69/matchlens-replay-runner:stable
            ghcr.io/shiroppu69/matchlens-replay-runner:${{ github.sha }}
          cache-from: type=gha,scope=replay-parser-image
          cache-to: type=gha,mode=max,scope=replay-parser-image
          provenance: false
