name: Replay parser

on:
  workflow_dispatch:
    inputs:
      slot_matrix:
        description: JSON array of parser slots to start
        required: true
        default: "[1]"
  schedule:
    # Avoid the top of the hour, when GitHub says scheduled runs can be delayed.
    - cron: "2-57/5 * * * *"

permissions:
  contents: read
  packages: read

jobs:
  parse-next:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.slot_matrix || '[1]') }}
    concurrency:
      group: dota-replay-parser-${{ matrix.slot }}
      cancel-in-progress: false
    env:
      MATCH_LENS_ORIGIN: ${{ vars.MATCH_LENS_ORIGIN || 'https://www.matchlens.dpdns.org' }}
      MAX_JOBS_PER_SLOT: 8
      DRAIN_BUDGET_SECONDS: 1800
      REPLAY_IMAGE: ghcr.io/shiroppu69/matchlens-replay-runner:stable
    steps:
      - name: Verify public runner resources
        run: |
          echo "CPU_CORES=$(nproc)"
          echo "MEMORY_BYTES=$(awk '/MemTotal/ {print $2 * 1024}' /proc/meminfo)"
          echo "ROOT_DISK_BYTES=$(df -B1 / | awk 'NR==2 {print $2}')"
          test "$(nproc)" -ge 4
          test "$(awk '/MemTotal/ {print int($2 / 1024 / 1024)}' /proc/meminfo)" -ge 14

      - name: Check production replay queue
        id: queue
        env:
          RUNNER_TOKEN: ${{ secrets.REPLAY_RUNNER_TOKEN }}
        run: |
          response=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --header "Authorization: Bearer ${RUNNER_TOKEN}" \
            "${MATCH_LENS_ORIGIN}/api/replay-jobs/runner" || true)
          available=$(echo "$response" | jq -r 'if .workAvailable == false then "false" else "true" end' 2>/dev/null || echo true)
          echo "has_work=$available" >> "$GITHUB_OUTPUT"
          echo "Replay queue preflight: ${response:-unavailable; failing open}"

      - name: Verify parser image access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker manifest inspect "$REPLAY_IMAGE" >/dev/null

      # Claim before pulling and booting the image so queue wait measures real
      # GitHub scheduling, while parser bootstrap is reported as running work.
      # Each slot then reuses the image and service for a bounded FIFO batch.
      - name: Drain replay queue
        if: steps.queue.outputs.has_work == 'true'
        env:
          RUNNER_TOKEN: ${{ secrets.REPLAY_RUNNER_TOKEN }}
          CALLBACK_TOKEN: ${{ secrets.REPLAY_CALLBACK_TOKEN }}
        run: |
          set -uo pipefail
          active_match_id=""
          active_job_id=""
          runner_id="${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}"
          processed=0
          empty_claims=0
          drain_deadline=$((SECONDS + DRAIN_BUDGET_SECONDS))

          runner_lifecycle() {
            action="$1"
            payload=$(jq -n --arg action "$action" --argjson slot "${{ matrix.slot }}" --arg runId "$runner_id" '{action:$action,slot:$slot,runId:$runId}')
            curl --silent --show-error --connect-timeout 5 --max-time 15 --request POST \
              --header "Authorization: Bearer ${RUNNER_TOKEN}" --header 'Content-Type: application/json' \
              --data "$payload" "${MATCH_LENS_ORIGIN}/api/replay-jobs/runner" >/dev/null || true
          }

          claim_next() {
            response=""
            for claim_attempt in $(seq 1 3); do
              echo "Claim attempt ${claim_attempt}/3 for slot ${{ matrix.slot }}"
              if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --request POST \
                --header "Authorization: Bearer ${RUNNER_TOKEN}" \
                "${MATCH_LENS_ORIGIN}/api/replay-jobs/next"); then break; fi
              response=""
              sleep 10
            done
            if [ -z "$response" ]; then
              echo "Claim endpoint remained unavailable after retries." >&2
              return 1
            fi
            active_match_id=$(echo "$response" | jq -r '.job.matchId // empty')
            active_job_id=$(echo "$response" | jq -r '.job.jobId // empty')
            replay_url=$(echo "$response" | jq -r '.job.replayUrl // empty')
            if [ -z "$active_match_id" ] || [ -z "$active_job_id" ] || [ -z "$replay_url" ]; then
              active_match_id=""
              active_job_id=""
              return 2
            fi
            starting=$(jq -n --arg jobId "$active_job_id" --arg stage "runner_starting" --arg parserInstance "$runner_id" \
              '{jobId:$jobId,heartbeat:true,stage:$stage,parserInstance:$parserInstance}')
            curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${CALLBACK_TOKEN}" --header 'Content-Type: application/json' \
              --data "$starting" "${MATCH_LENS_ORIGIN}/api/replay-enhancements/${active_match_id}" >/dev/null || true
            echo "Claimed replay ${active_match_id}; starting parser runtime."
            return 0
          }

          release_active_lease() {
            if [ -z "$active_match_id" ] || [ -z "$active_job_id" ]; then return 0; fi
            payload=$(jq -n --arg jobId "$active_job_id" --arg error "Replay runner interrupted before completion; the site will retry automatically." '{jobId:$jobId,error:$error}')
            release_status=$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' --request POST \
              --header "Authorization: Bearer ${CALLBACK_TOKEN}" --header 'Content-Type: application/json' \
              --data "$payload" "${MATCH_LENS_ORIGIN}/api/replay-enhancements/${active_match_id}" || true)
            if [ "$release_status" != 200 ] && [ "$release_status" != 409 ]; then
              cat /tmp/release.json 2>/dev/null || true
              echo "Replay lease release returned HTTP ${release_status:-transport-error}." >&2
            fi
            active_match_id=""
            active_job_id=""
          }

          cleanup() {
            exit_code=$?
            trap - EXIT INT TERM
            release_active_lease
            runner_lifecycle stop
            docker logs --tail 200 replay-parser 2>/dev/null || true
            docker rm --force replay-parser >/dev/null 2>&1 || true
            exit "$exit_code"
          }
          trap cleanup EXIT INT TERM

          runner_lifecycle start

          claim_status=0
          claim_next || claim_status=$?
          if [ "$claim_status" -eq 2 ]; then
            echo "Replay queue was empty when the runner claimed work."
            exit 0
          fi
          if [ "$claim_status" -ne 0 ]; then exit 1; fi

          bootstrap_started=$SECONDS
          docker pull "$REPLAY_IMAGE"
          docker image inspect "$REPLAY_IMAGE" --format 'Replay image {{index .RepoDigests 0}} ({{.Size}} bytes)'

          docker run --detach --name replay-parser --publish 8080:8080 \
            --env SERVICE_TOKEN=local-runner \
            --env CALLBACK_TOKEN="$CALLBACK_TOKEN" \
            --env CALLBACK_BASE_URL="$MATCH_LENS_ORIGIN" \
            "$REPLAY_IMAGE"
          healthy=false
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Replay parser did not become healthy." >&2
            exit 1
          fi
          bootstrap_ms=$(( (SECONDS - bootstrap_started) * 1000 ))
          ready=$(jq -n --arg jobId "$active_job_id" --arg stage "parser_ready" --argjson bootstrapMs "$bootstrap_ms" \
            '{jobId:$jobId,heartbeat:true,stage:$stage,timings:{bootstrapMs:$bootstrapMs}}')
          curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${CALLBACK_TOKEN}" --header 'Content-Type: application/json' \
            --data "$ready" "${MATCH_LENS_ORIGIN}/api/replay-enhancements/${active_match_id}" >/dev/null || true

          while [ "$processed" -lt "$MAX_JOBS_PER_SLOT" ] && [ "$SECONDS" -lt $((drain_deadline - 660)) ]; do
            runner_lifecycle heartbeat
            echo "Processing replay ${active_match_id} (${processed}/${MAX_JOBS_PER_SLOT} already completed in this slot)."
            submit=$(jq -n --arg jobId "$active_job_id" --arg matchId "$active_match_id" --arg replayUrl "$replay_url" '{jobId:$jobId,matchId:$matchId,replayUrl:$replayUrl}')
            if ! job=$(curl --fail --silent --show-error --request POST \
              --header 'Authorization: Bearer local-runner' --header 'Content-Type: application/json' \
              --data "$submit" http://127.0.0.1:8080/v1/jobs); then
              echo "Local replay service rejected ${active_match_id}." >&2
              release_active_lease
              exit 1
            fi
            service_job_id=$(echo "$job" | jq -r '.job.id // empty')
            if [ -z "$service_job_id" ]; then
              echo "Local replay service returned no job id for ${active_match_id}." >&2
              release_active_lease
              exit 1
            fi

            completed=false
            for poll_attempt in $(seq 1 120); do
              state=$(curl --fail --silent --header 'Authorization: Bearer local-runner' "http://127.0.0.1:8080/v1/jobs/$service_job_id" || true)
              status=$(echo "$state" | jq -r '.job.status // empty' 2>/dev/null || true)
              if [ "$status" = completed ]; then completed=true; break; fi
              if [ "$status" = failed ]; then
                echo "$state" | jq || true
                break
              fi
              if (( poll_attempt % 6 == 0 )); then
                runner_lifecycle heartbeat
                heartbeat=$(jq -n --arg jobId "$active_job_id" '{jobId:$jobId,heartbeat:true}')
                heartbeat_status=$(curl --silent --show-error --output /tmp/heartbeat.json --write-out '%{http_code}' --request POST \
                  --header "Authorization: Bearer ${CALLBACK_TOKEN}" --header 'Content-Type: application/json' \
                  --data "$heartbeat" "${MATCH_LENS_ORIGIN}/api/replay-enhancements/${active_match_id}" || true)
                if [ "$heartbeat_status" != 200 ] && [ "$heartbeat_status" != 409 ]; then
                  cat /tmp/heartbeat.json 2>/dev/null || true
                  echo "Heartbeat callback returned HTTP ${heartbeat_status:-transport-error}." >&2
                fi
              fi
              sleep 5
            done

            if [ "$completed" = true ]; then
              echo "Replay ${active_match_id} completed."
              active_match_id=""
              active_job_id=""
            else
              echo "Replay ${active_match_id} did not complete; releasing its lease and continuing." >&2
              release_active_lease
            fi
            processed=$((processed + 1))

            if [ "$processed" -ge "$MAX_JOBS_PER_SLOT" ] || [ "$SECONDS" -ge $((drain_deadline - 660)) ]; then
              break
            fi

            claim_status=0
            claim_next || claim_status=$?
            if [ "$claim_status" -eq 2 ]; then
              empty_claims=$((empty_claims + 1))
              if [ "$empty_claims" -lt 2 ]; then
                echo "Replay queue is empty; keeping slot alive for a 10-second arrival grace period."
                sleep 10
                claim_status=0
                claim_next || claim_status=$?
              fi
            fi
            if [ "$claim_status" -eq 2 ]; then
              echo "Replay queue remained empty after ${processed} job(s) in this slot."
              break
            fi
            if [ "$claim_status" -ne 0 ]; then exit 1; fi
            empty_claims=0
          done

          echo "Slot ${{ matrix.slot }} drained ${processed} replay job(s)."
